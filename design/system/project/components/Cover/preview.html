<!-- @dsCard height=300 -->
<style>
body{margin:0;background:var(--stone)}
.cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--stone)}
.arc{fill:none;stroke:var(--accent)}
.g2{fill:var(--graphite)}.g3{fill:var(--graphite-2)}.ac{fill:var(--accent)}.st2{fill:var(--stone-2)}.pp{fill:var(--paper-2)}
.name{position:absolute;left:40px;bottom:66px;margin:0;font-family:var(--font-display);font-weight:600;font-size:120px;line-height:.9;letter-spacing:-.05em;color:var(--ink)}
.tag{position:absolute;left:44px;bottom:36px;margin:0;font-family:var(--font-body);font-size:14px;color:var(--ink-2);max-width:420px}
</style>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: graphite slab 300 x 300 (bleeds top and bottom), graphite-2 panel 136 x 220 at radius-panel (28px), stone-2 band 72 x 300, all from the palette
     arrangement: one tall graphite slab carrying the ring, a rounded panel beside it like the site's stacked panels, a stone-2 strip at the right edge
     pattern row: literal motif (the ring): concentric bands cut from paper-2 and graphite, with a coral arc for spent, because the ring is the brand's one object
     scales: ring band 22% of radius as in the UI, coral arc 0.62 turn, panel radius 28px = radius-panel -->
<rect class="st2" x="888" y="0" width="72" height="300"/>
<rect class="g2" x="520" y="0" width="300" height="300"/>
<circle cx="670" cy="150" r="104" class="pp"/>
<circle cx="670" cy="150" r="81" class="g2"/>
<circle cx="670" cy="150" r="94" class="arc" stroke-width="7" stroke-dasharray="366 591" transform="rotate(-90 670 150)"/>
<rect class="g3" x="742" y="40" width="136" height="220" rx="28"/>
</svg>
<h1 class="name">tab</h1>
<p class="tag">Spending limits for AI agents. The ring is the limit.</p>
</div>
