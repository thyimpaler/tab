<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;600&family=Geist+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(180deg,#e8e6e0 0%,#cfccc5 100%);color:#0a0a09;font-family:"Funnel Display",sans-serif;position:relative}
.wm{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:14px;font:600 34px "Funnel Display";letter-spacing:-.04em}
.wm img{width:48px;height:48px;border-radius:12px;box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
h1{position:absolute;left:64px;top:168px;margin:0;font-weight:400;font-size:80px;line-height:.92;letter-spacing:-.035em}
h1 span{color:#5b5a55}
p{position:absolute;left:68px;bottom:56px;margin:0;font:500 16px "Geist Mono";letter-spacing:.08em;text-transform:uppercase;color:#5b5a55}
.ring{position:absolute;right:56px;top:105px;width:420px;height:420px;border-radius:50%;
  background:conic-gradient(from 250deg,#fbfaf7,#8e8c86 12%,#2a2a28 24%,#cfccc5 36%,#fff 46%,#6f6d68 60%,#e8e6e0 72%,#3a3936 84%,#fbfaf7);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 22%),#000 calc(100% - 22% + 1px));filter:drop-shadow(0 30px 50px rgba(0,0,0,.3))}
.arc{position:absolute;right:calc(56px + 19px);top:124px;width:382px;height:382px;border-radius:50%;
  background:conic-gradient(#ff4d2e 0 .62turn,rgba(0,0,0,.35) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4.4%),#000 calc(100% - 4.4% + 1px))}
.num{position:absolute;right:56px;top:105px;width:420px;height:420px;display:grid;place-content:center;text-align:center}
.num b{font:500 64px "Geist Mono";letter-spacing:-.04em}
.num i{font:500 13px "Geist Mono";font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#5b5a55;margin-top:8px}
</style></head><body>
<div class="wm"><img src="tab-logo-icon.png" alt="">tab</div>
<h1>Give your agent<br>a tab. <span>Not<br>your wallet.</span></h1>
<p>Spending limits for AI agents · USDC on Solana</p>
<div class="ring"></div><div class="arc"></div>
<div class="num"><b>1.90</b><i>USDC left of 5.00</i></div>
</body></html>
